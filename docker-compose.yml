version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints/onnx:/checkpoints/onnx:ro
    environment:
      - ONNX_MODEL_DIR=/checkpoints/onnx
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
